parent=keycloak.v3

# Match the login theme: single-palette, no dark mode.
darkMode=false

# The Account Console (keycloak.v3) is a vendor-shipped React SPA - there is
# no non-JS server-rendered account theme left in Keycloak 26. We do not
# author or ship any custom JavaScript of our own here; this is a CSS-only
# skin plus the officially supported logo/logoUrl branding properties.
styles=css/gizmo-account.css

logo=img/gizmo-seal.png
logoUrl=https://gizmoshop.example

favIcon=/img/favicon.ico
favIconType=image/x-icon
