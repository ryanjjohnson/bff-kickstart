parent=keycloak.v2
import=common/keycloak

# Keep the login theme single-palette so we don't have to fight PatternFly's
# higher-specificity dark-mode selectors.
darkMode=false

# Keep the parent's compiled PatternFly bundle (css/styles.css resolves via
# theme inheritance to keycloak.v2's file since we don't ship our own copy),
# then layer our overrides on top.
styles=css/styles.css css/gizmo-overrides.css

# keycloak.v2's template.ftl hardcodes img/favicon.ico (no theme.properties
# hook) - we ship our own at resources/img/favicon.ico to override it.
