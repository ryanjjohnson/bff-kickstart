# Public-deployment overlay: docker compose -f docker-compose.yml -f deploy/docker-compose.deploy.yml up -d
#
# Adds a Cloudflare Tunnel and rewires the stack for a real HTTPS origin:
#   https://${APP_HOSTNAME}  -> frontend (nginx)
#   https://${SSO_HOSTNAME}  -> keycloak
# Values come from deploy/.env.deploy (generated by deploy/deploy.sh) -
# run compose with:  --env-file .env --env-file deploy/.env.deploy
#
# The browser reaches Keycloak only through its public hostname; the backend
# keeps talking to it container-to-container (KC_HOSTNAME_BACKCHANNEL_DYNAMIC
# lets Keycloak accept both while stamping the public issuer into tokens).

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${TUNNEL_TOKEN}"]
    networks: [bff-kickstart]
    depends_on:
      - frontend
      - keycloak

  keycloak:
    # The tunnel reaches Keycloak over the compose network, and its /admin* is
    # deliberately NOT routed to the public internet (see provision-tunnel.sh).
    # This host port is how you reach the admin console instead - published on
    # the LAN only. Safe default is 127.0.0.1 (box-only; use an SSH tunnel);
    # set KC_ADMIN_BIND to the host's LAN IP in deploy/.env.deploy to reach it
    # from other machines on the LAN. Never bind this to 0.0.0.0 on a host that
    # is port-forwarded from the internet - that would re-expose /admin.
    ports: !override
      - "${KC_ADMIN_BIND:-127.0.0.1}:${KC_ADMIN_PORT:-18080}:8080"
    environment:
      # Public identity: token issuer and every URL Keycloak renders/embeds.
      KC_HOSTNAME: https://${SSO_HOSTNAME}
      # Backend containers still call http://keycloak:8080 directly (token,
      # jwks, userinfo, introspection) - this permits that without weakening
      # the public issuer.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # TLS terminates at Cloudflare's edge; trust the forwarded headers the
      # tunnel injects so Keycloak knows the real scheme and marks its cookies
      # Secure.
      KC_PROXY_HEADERS: xforwarded
      # Serve the admin console on its own URL (the LAN host port) so it doesn't
      # redirect to the public KC_HOSTNAME, whose /admin the tunnel 404s. Set to
      # the LAN admin URL (e.g. http://192.168.1.191:18080) in deploy/.env.deploy
      # alongside KC_ADMIN_BIND; empty = admin console follows KC_HOSTNAME.
      KC_HOSTNAME_ADMIN: ${KC_ADMIN_URL:-}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      # The deploy-patched realm export (public redirect URIs + rotated client
      # secret) replaces the stock one - same import path, different source.
      - ./deploy/realm-export:/opt/keycloak/data/import

  backend:
    ports: !override []
    environment:
      # Browser-facing URI: the redirect to the login page must use the public
      # hostname. Issuer must match what Keycloak now stamps into tokens.
      KEYCLOAK_AUTH_URI: https://${SSO_HOSTNAME}/realms/gizmoshop/protocol/openid-connect/auth
      KEYCLOAK_ISSUER_URI: https://${SSO_HOSTNAME}/realms/gizmoshop
      # token/jwk-set/user-info/introspect URIs deliberately keep their base
      # values (http://keycloak:8080/...) - server-to-server, no edge hairpin.
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: https://${APP_HOSTNAME}
      # Session + CSRF cookies over HTTPS only (Spring relaxed env binding).
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"

  frontend:
    ports: !override []

  mailhog:
    # Keep the mail UI reachable on the LAN at an unlikely-to-collide port.
    ports: !override
      - "18025:8025"
