# All values below that reference a frontend/backend URL or path are
# parameterized via ${VAR:default} placeholders so this app can be reused as a
# template under different hostnames/ports/paths without editing this file -
# see docker-compose.yml and the root README for the full list of env vars.

server.port=${BACKEND_PORT:8081}
server.forward-headers-strategy=framework
# This is purely internal now - never reached directly by a browser. The
# frontend's proxy (vite.config.ts / nginx.conf.template) nests the whole API
# under its own path externally and rewrites onto this one before forwarding;
# see "Backend proxying" in the frontend README.
server.servlet.context-path=${BACKEND_BASE_PATH:/bff-kickstart-api}
# Must stay comfortably longer than SessionTimeoutMonitor's 5-minute idle
# threshold (frontend/src/auth/SessionTimeoutMonitor.tsx) - if the two ever
# race, this one loses first, so /logout arrives with no authenticated
# session left. Without an OidcUser to read the id_token_hint from,
# OidcClientInitiatedLogoutSuccessHandler can't build the Keycloak
# end-session redirect and falls back to Spring's default post-logout target
# ("/", i.e. this server's own context-path root) - a 404, since nothing is
# mapped there. Keeping this well above the client-side timeout ensures the
# client's own logout() call always finds a still-live session to log out of.
server.servlet.session.timeout=${SESSION_TIMEOUT:15m}
server.servlet.session.cookie.name=BFFKICKSTARTSESSION
# Without an explicit path, this defaults to server.servlet.context-path
# (the backend's internal-only path) - since the browser never visits that
# path directly anymore (see above), it would never send this cookie back on
# a /bff-kickstart/** request, silently losing the pending OAuth2 authorization
# request (stored server-side, keyed to the session) between the initial
# /oauth2/authorization/keycloak redirect and the /login/oauth2/code/keycloak
# callback - login would fail every time with no exception logged, since
# Spring never even gets far enough to attempt the token exchange. Same root
# cause, same fix, as the CookieCsrfTokenRepository path override in
# SecurityConfig - "/" makes it visible on both paths the browser actually uses.
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.application.name=bff-kickstart-backend

# In-memory only - nothing here persists across a restart. MODE=Oracle gets H2 to accept and
# behave like Oracle's SQL dialect (DUAL, ROWNUM, string concat via ||, etc.) - the closest
# in-process stand-in for Oracle without an Oracle license. DB_CLOSE_DELAY=-1 keeps the database
# alive for the JVM's whole lifetime rather than dropping it the moment the first pooled
# connection closes (H2's normal in-memory default). Nothing left to parameterize by env var -
# there's no host/port/credentials for an embedded, in-process database.
#
# Bound directly onto a HikariDataSource bean (config/DataSourceConfig.java), not read via
# Spring Boot's usual spring.datasource.* auto-configuration - "jdbc-url" (not "url") is
# HikariDataSource's own property name (relaxed-binds to setJdbcUrl).
db.kickstart-tx.jdbc-url=jdbc:h2:mem:bff_kickstart;MODE=Oracle;DB_CLOSE_DELAY=-1
db.kickstart-tx.driver-class-name=org.h2.Driver
db.kickstart-tx.username=sa
db.kickstart-tx.password=

# The "data warehouse" - a second, separate in-memory database (its own Hikari pool, its own
# EntityManagerFactory/TransactionManager, its own Flyway migration history - see
# reporting/config/ReportingDataSourceConfig.java) backing the read-only daily_reports feature.
db.kickstart-rpt.jdbc-url=jdbc:h2:mem:bff_kickstart_rpt;MODE=Oracle;DB_CLOSE_DELAY=-1
db.kickstart-rpt.driver-class-name=org.h2.Driver
db.kickstart-rpt.username=sa
db.kickstart-rpt.password=

# hibernate.hbm2ddl.auto is "none", not "validate": Oracle's DATE type always carries a time
# component (unlike ANSI SQL DATE), and H2's MODE=Oracle faithfully replicates that by reporting
# every "date"-declared column as TIMESTAMP - a genuine, documented consequence of choosing Oracle
# compatibility, not a mistake in the migrations below. That would make Hibernate's schema
# validator reject scheduled_date/completed_date/issued_date/expiration_date as a type mismatch
# against their LocalDate-typed entity fields, even though reads/writes of those columns work fine
# at the JDBC level (H2's driver coerces TIMESTAMP <-> LocalDate transparently). Flyway remains the
# sole schema owner either way - ddl-auto never generates DDL - this just stops Hibernate's own
# extra, overly strict check. Set directly on the EntityManagerFactory bean now, not here -
# see config/DataSourceConfig.java's class comment for why the EMF itself is now built by hand.
spring.jpa.open-in-view=false

# Default 1MB is too small for a CSV bulk-import of any real size (see the
# Data Manager import endpoints on FacilityController/PermitController/
# InspectionController).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Flyway (both datasources) is wired up manually in Java, not via spring.flyway.* - see
# config/DataSourceConfig.java and reporting/config/ReportingDataSourceConfig.java's class
# comments for why (each datasource needs its own FlywayMigrationInitializer bean once more than
# one DataSource bean exists in the context).

spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID:bff-kickstart-client}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:bff-kickstart-secret}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid, profile, email
# {baseUrl} includes server.servlet.context-path automatically (e.g. resolving
# to http://localhost:8081/bff-kickstart-api/login/oauth2/code/keycloak if you
# hit the backend directly) - but every real request arrives through the
# frontend's proxy, which sends X-Forwarded-Prefix (see frontend/README.md's
# "Backend proxying"). Spring's ForwardedHeaderFilter (forward-headers-strategy
# =framework above) uses that to override the path Spring thinks it's on for
# URL generation, so {baseUrl} actually resolves using FRONTEND_BASE_PATH, not
# this context-path - e.g. http://localhost:3000/bff-kickstart/login/oauth2/code/keycloak
# through nginx. Verified directly, and this is also what's registered in the
# realm export's redirectUris - not the context-path form.
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/keycloak
spring.security.oauth2.client.registration.keycloak.client-name=BFF Kickstart

spring.security.oauth2.client.provider.keycloak.authorization-uri=${KEYCLOAK_AUTH_URI:http://keycloak:8080/realms/gizmoshop/protocol/openid-connect/auth}
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://keycloak:8080/realms/gizmoshop/protocol/openid-connect/token}
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/gizmoshop/protocol/openid-connect/certs}
spring.security.oauth2.client.provider.keycloak.user-info-uri=${KEYCLOAK_USER_INFO_URI:http://keycloak:8080/realms/gizmoshop/protocol/openid-connect/userinfo}
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/gizmoshop}
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

# Used by MeController to actively re-verify the session with Keycloak (RFC 7662
# token introspection) rather than relying solely on Keycloak's backchannel-logout
# push reaching us - see the class comment for why both matter.
app.keycloak.introspection-uri=${KEYCLOAK_INTROSPECT_URI:http://keycloak:8080/realms/gizmoshop/protocol/openid-connect/token/introspect}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.keycloak.client-id=${KEYCLOAK_CLIENT_ID:bff-kickstart-client}
# Where the frontend SPA is mounted - used to build both the post-login
# redirect (SecurityConfig's oauth2Login successHandler) and the post-logout
# redirect target (SecurityConfig#oidcLogoutSuccessHandler). The latter must
# match a registered post.logout.redirect.uris entry in the Keycloak client.
app.frontend-base-path=${FRONTEND_BASE_PATH:/bff-kickstart}

# Enables OAuth2 Resource Server support (Bearer JWT / client_credentials API clients) on
# /api/**, alongside the always-on session-based BFF login above - see SecurityConfig. Off by
# default; harmless either way since this app defines its own SecurityFilterChain (no Spring
# Boot auto-configured fallback chain for the jwk-set-uri property below to accidentally activate).
app.api-exposed=${API_EXPOSED:false}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/gizmoshop/protocol/openid-connect/certs}

# Swagger UI / OpenAPI docs, off by default, reachable through the frontend's own proxy
# (nginx.conf.template's /swagger-ui/ and /v3/api-docs locations) when enabled - gated
# further behind the API Developer role, see SecurityConfig.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# SMTP - Mailhog in Docker Compose (a fake mail server with a web UI at :8025, nothing is
# actually delivered). No auth/TLS since Mailhog doesn't require either.
spring.mail.host=${SMTP_HOST:mailhog}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=noreply@gizmoshop.example

logging.level.org.springframework.security=INFO
logging.level.com.example.bffkickstart=DEBUG

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
